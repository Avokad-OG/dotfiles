[ids]

*

[main]

# Caps Lock is a pure Fn modifier: hold it for the fn layer below (hjkl
# become arrows, 1-9 switch tmux windows). It never emits the Caps Lock
# keycode.
capslock = layer(fn)

[fn]

h = left
j = down
k = up
l = right

# Fn + 1-9 -> tmux-style prefix (ctrl+b) + number
1 = macro(C-b 1)
2 = macro(C-b 2)
3 = macro(C-b 3)
4 = macro(C-b 4)
5 = macro(C-b 5)
6 = macro(C-b 6)
7 = macro(C-b 7)
8 = macro(C-b 8)
9 = macro(C-b 9)
