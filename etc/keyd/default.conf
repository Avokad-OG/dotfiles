[ids]

*

[main]

# Caps Lock key:
#   - tap (quick press)  -> Caps Lock toggle
#   - hold               -> activates the "fn" layer (hjkl become arrows)
capslock = overload(fn, capslock)

[fn]

h = left
j = down
k = up
l = right

# Fn + 1-9 -> tmux-style prefix (ctrl+b) + number
1 = macro(C-b 1)
2 = macro(C-b 2)
3 = macro(C-b 3)
4 = macro(C-b 4)
5 = macro(C-b 5)
6 = macro(C-b 6)
7 = macro(C-b 7)
8 = macro(C-b 8)
9 = macro(C-b 9)
