# Prefix
set -g prefix C-Space
set -g prefix2 C-b
bind -N "Send prefix" C-Space send-prefix

# Config and help
bind -N "Reload configuration" q source-file ~/.config/tmux/tmux.conf \; display "Configuration reloaded"
bind -N "Show Tmux keybindings" ? display-popup -E -w 80% -h 70% -T "Tmux keybindings" "omarchy-menu-tmux-keybindings --print | less -R"

# Vi mode for copy
setw -g mode-keys vi
bind -N "Begin selection" -T copy-mode-vi v send -X begin-selection
bind -N "Copy selection" -T copy-mode-vi y send -X copy-selection-and-cancel

# Pane Controls
bind -N "Split pane vertically" -n M-Enter split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" -n M-S-Enter split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" -n M-Escape kill-pane

bind -N "Split pane vertically" h split-window -v -c "#{pane_current_path}"
bind -N "Split pane horizontally" v split-window -h -c "#{pane_current_path}"
bind -N "Kill pane" x kill-pane

bind -N "Focus pane left" -n C-M-Left select-pane -L
bind -N "Focus pane right" -n C-M-Right select-pane -R
bind -N "Focus pane up" -n C-M-Up select-pane -U
bind -N "Focus pane down" -n C-M-Down select-pane -D

# Smart pane navigation with nvim (vim-tmux-navigator)
# If the pane is running (n)vim, forward C-h/j/k/l to it so nvim can
# switch its own windows (and hand off to tmux at the edge);
# otherwise switch the tmux pane directly.
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -N "Focus pane left (or nvim)" -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -N "Focus pane down (or nvim)" -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -N "Focus pane up (or nvim)" -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -N "Focus pane right (or nvim)" -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"

bind -N "Resize pane left" -n C-M-S-Left resize-pane -L 5
bind -N "Resize pane down" -n C-M-S-Down resize-pane -D 5
bind -N "Resize pane up" -n C-M-S-Up resize-pane -U 5
bind -N "Resize pane right" -n C-M-S-Right resize-pane -R 5

# Window navigation
bind -N "Rename window" r command-prompt -I "#W" "rename-window -- '%%'"
bind -N "Create window" c new-window -c "#{pane_current_path}"
bind -N "Kill window" k kill-window

bind -N "Switch to window 1" -n M-1 select-window -t 1
bind -N "Switch to window 2" -n M-2 select-window -t 2
bind -N "Switch to window 3" -n M-3 select-window -t 3
bind -N "Switch to window 4" -n M-4 select-window -t 4
bind -N "Switch to window 5" -n M-5 select-window -t 5
bind -N "Switch to window 6" -n M-6 select-window -t 6
bind -N "Switch to window 7" -n M-7 select-window -t 7
bind -N "Switch to window 8" -n M-8 select-window -t 8
bind -N "Switch to window 9" -n M-9 select-window -t 9

bind -N "Previous window" -n M-Left select-window -t -1
bind -N "Next window" -n M-Right select-window -t +1
bind -N "Move window left" -n M-S-Left swap-window -t -1 \; select-window -t -1
bind -N "Move window right" -n M-S-Right swap-window -t +1 \; select-window -t +1

# Session controls
bind -N "Rename session" R command-prompt -I "#S" "rename-session -- '%%'"
bind -N "Create session" C new-session -c "#{pane_current_path}"
bind -N "Kill session" K kill-session
bind -N "Previous session" P switch-client -p
bind -N "Next session" N switch-client -n

bind -N "Previous session" -n M-Up switch-client -p
bind -N "Next session" -n M-Down switch-client -n

# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 150
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #S #[bg=default] "
# Top-right: running app, hostname, CPU, battery, then weather.
# #{pane_current_command} is the foreground process of the active pane.
# Colors follow the Catppuccin Mocha theme (kitty.conf):
#   app #cdd6f4, host #a6adc8, CPU #f9e2af, battery (dynamic), weather #89b4fa
set -g status-right "#[fg=#89b4fa]#{?pane_in_mode,COPY ,}#{?client_prefix,PREFIX ,}#{?window_zoomed_flag,ZOOM ,}#[fg=#cdd6f4]#{pane_current_command} #[fg=#a6adc8]#h #[fg=#f9e2af]#{cpu_icon} #{cpu_percentage} #{battery_color_fg}#{battery_icon} #{battery_percentage} #[fg=#89b4fa]#{weather} "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# ---------------------------------------------------------------------------
# Plugins (TPM) - tmux-resurrect + tmux-continuum + tmux-weather + tmux-cpu + tmux-battery
# ---------------------------------------------------------------------------
# resurrect:   manual session save (prefix + Ctrl-s) / restore (prefix + Ctrl-r)
# continuum:   auto-save every 15 min via status-right; auto-restore last
#               session on server start (opt-in: @continuum-restore defaults
#               to 'off', enabled below). Change the auto-save interval with:
#                 set -g @continuum-save-interval '30'
#
# tmux-weather (xamut): shows the weather in status-right via #{weather}.
# Data from wttr.in; re-fetched every @tmux-weather-interval minutes (15).
# Other formats: %c=condition %t=temp %w=wind %h=humidity %P=precipitation
#   e.g. set -g @tmux-weather-format '%c+%t+%w'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'xamut/tmux-weather'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'

# CPU + battery icons (Meslo LG Nerd Font glyphs)
set -g @cpu_low_icon ''
set -g @cpu_medium_icon ''
set -g @cpu_high_icon ''
set -g @batt_icon_status_charging '󰂄'
set -g @batt_icon_status_charged '󰂅'
set -g @batt_icon_status_attached '󰂄'
set -g @batt_icon_status_unknown '󰂑'
set -g @batt_icon_charge_tier1 '󰁺'
set -g @batt_icon_charge_tier2 '󰁻'
set -g @batt_icon_charge_tier3 '󰁼'
set -g @batt_icon_charge_tier4 '󰁾'
set -g @batt_icon_charge_tier5 '󰁿'
set -g @batt_icon_charge_tier6 '󰂀'
set -g @batt_icon_charge_tier7 '󰂁'
set -g @batt_icon_charge_tier8 '󰂂'

# Battery color (Catppuccin): green normally, yellow 20-34%, red below 20%
set -g @batt_color_charge_primary_tier1 '#f38ba8'
set -g @batt_color_charge_primary_tier2 '#f38ba8'
set -g @batt_color_charge_primary_tier3 '#f9e2af'
set -g @batt_color_charge_primary_tier4 '#a6e3a1'
set -g @batt_color_charge_primary_tier5 '#a6e3a1'
set -g @batt_color_charge_primary_tier6 '#a6e3a1'
set -g @batt_color_charge_primary_tier7 '#a6e3a1'
set -g @batt_color_charge_primary_tier8 '#a6e3a1'
set -g @batt_color_status_primary_charging '#a6e3a1'
set -g @batt_color_status_primary_charged '#a6e3a1'
set -g @batt_color_status_primary_attached '#a6e3a1'
set -g @batt_color_status_primary_unknown '#a6adc8'
set -g @batt_color_charge_secondary_tier1 'default'
set -g @batt_color_charge_secondary_tier2 'default'
set -g @batt_color_charge_secondary_tier3 'default'
set -g @batt_color_charge_secondary_tier4 'default'
set -g @batt_color_charge_secondary_tier5 'default'
set -g @batt_color_charge_secondary_tier6 'default'
set -g @batt_color_charge_secondary_tier7 'default'
set -g @batt_color_charge_secondary_tier8 'default'
set -g @batt_color_status_secondary_charging 'default'
set -g @batt_color_status_secondary_charged 'default'
set -g @batt_color_status_secondary_attached 'default'
set -g @batt_color_status_secondary_unknown 'default'
# Weather (tmux-weather): set your location, e.g. 'Paris,France'.
# set -g @tmux-weather-location 'City,Country'
# set -g @tmux-weather-format '%c+%t'   # default: condition + temp, e.g. "⛅ +7°C"
# set -g @tmux-weather-units 'm'        # m = metric (default), u = USCS
# set -g @tmux-weather-interval '15'    # minutes between wttr.in fetches

# Auto-restore the last saved session when the tmux server starts
set -g @continuum-restore 'on'

# Also capture pane scrollback contents (shell history, buffers, etc.) on save
set -g @resurrect-capture-pane-contents 'on'

# TPM must be the last line so plugins load after all other settings.
# TPM is installed by the per-OS installer. After the first install, reload
# this config and press prefix + I (capital I) to install the plugins.
run-shell '~/.config/tmux/plugins/tpm/tpm'
